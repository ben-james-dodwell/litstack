name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - uses: actions/checkout@v7

      - name: Resolve checks.yml run that built this commit
        id: source-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          PR_NUMBER=$(git log -1 --pretty=%s | grep -oP '(?<=\(#)\d+(?=\)$)') || true

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not find a merged PR number in the latest commit message; refusing to rebuild the release artifact (this pipeline builds once in checks.yml and reuses that artifact everywhere, it never rebuilds for deploy)."
            exit 1
          fi

          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')

          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/checks.yml/runs?head_sha=$HEAD_SHA&event=pull_request&status=success" --jq '.workflow_runs[0].id // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find a successful checks.yml run for commit $HEAD_SHA (PR #$PR_NUMBER). Its release artifact may have expired (5 day retention) - re-run checks.yml on that PR (or push an empty commit) and retry."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Release Artifact
        uses: actions/download-artifact@v8
        with:
          name: release
          run-id: ${{ steps.source-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Copy Release Artifact to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.LIVE_SSH_HOST }}
          username: ${{ secrets.LIVE_SSH_USER }}
          key: ${{ secrets.LIVE_SSH_KEY }}
          source: release.tar.gz
          target: /tmp

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.LIVE_SSH_HOST }}
          username: ${{ secrets.LIVE_SSH_USER }}
          key: ${{ secrets.LIVE_SSH_KEY }}
          script: |
            set -e
            cd /var/www/litstack

            git fetch --all
            git reset --hard origin/master

            rm -rf vendor public/build
            tar xzf /tmp/release.tar.gz -C .
            rm -f /tmp/release.tar.gz

            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize

            php artisan queue:restart
